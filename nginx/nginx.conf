events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # ─── Rate limiting zones ─────────────────────────────────────────────────

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=qr:10m rate=20r/m;

  # ─── Gzip compression ────────────────────────────────────────────────────

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain application/json application/javascript text/css
             application/xml text/xml application/x-www-form-urlencoded;

  # ─── Upstream services ───────────────────────────────────────────────────

  upstream backend {
    server backend:3000;
    keepalive 32;
  }

  upstream ia_service {
    server ia-service:8001;
    keepalive 16;
  }

  upstream frontend {
    server frontend:80;
    keepalive 16;
  }

  # ─── HTTP → HTTPS redirect + ACME challenge ──────────────────────────────

  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── Main HTTPS server ───────────────────────────────────────────────────

  server {
    listen 443 ssl;
    server_name ${DOMAIN};

    ssl_certificate     /etc/nginx/certs/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ─── Security headers ────────────────────────────────────────────────

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Frontend (SPA) ──────────────────────────────────────────────────

    location / {
      proxy_pass         http://frontend;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_cache_bypass $http_upgrade;
    }

    # ─── Backend API ─────────────────────────────────────────────────────

    location /api/ {
      limit_req zone=api burst=20 nodelay;

      proxy_pass         http://backend;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;
    }

    # ─── WebSocket (Socket.IO) ───────────────────────────────────────────

    location /socket.io/ {
      proxy_pass             http://backend;
      proxy_http_version     1.1;
      proxy_set_header       Upgrade $http_upgrade;
      proxy_set_header       Connection "upgrade";
      proxy_set_header       Host $host;
      proxy_set_header       X-Real-IP $remote_addr;
      proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout     3600s;
      proxy_send_timeout     3600s;
    }

    # ─── IA service (internal proxy — Prophet can be slow) ───────────────

    location /ia/ {
      limit_req zone=api burst=10 nodelay;

      proxy_pass         http://ia_service;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
      proxy_connect_timeout 15s;
    }

    # ─── OTA webhooks (Booking.com, Expedia, Airbnb) ─────────────────────

    location /api/v1/canales/webhook/ {
      limit_req zone=webhook burst=5 nodelay;

      proxy_pass       http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ─── QR check-in (public — moderate rate limit) ──────────────────────

    location /api/v1/checkin/qr {
      limit_req zone=qr burst=10 nodelay;

      proxy_pass       http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── WhatsApp webhook (token-verified, no JWT) ───────────────────────

    location /api/v1/whatsapp/webhook {
      limit_req zone=webhook burst=20 nodelay;

      proxy_pass       http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
